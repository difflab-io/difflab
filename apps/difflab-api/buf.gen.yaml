version: v2
clean: true
managed:
  enabled: true
plugins:
  - local: ['../../node_modules/.bin/protoc-gen-es']
    out: src/gen
    include_imports: true
    opt:
      - target=ts
      - import_extension=js
  - local: ['../../node_modules/.bin/protoc-gen-es']
    out: ../../libs/difflab-client-ts/src/gen
    include_imports: true
    opt:
      - target=ts
      - import_extension=js
