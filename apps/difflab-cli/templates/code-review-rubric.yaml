version: 1
review_defaults:
  model_policy: retain-frontier
review:
  base_revision: null
  head_revision: null
  working_tree: null
  changed_files: []
  exclusions: []
  reviewers: []
sections:
  - title: Intent Delivery
    criteria:
      - id: intent.objective
        scope: review
        default_severity: blocking
        issue: The change contradicts its stated intent or omits required behavior.
        results: []
      - id: intent.scope
        scope: review
        default_severity: consider
        issue: The change includes work outside its stated scope.
        results: []
  - title: Readability
    criteria:
      - id: readability.function-names
        scope: file
        default_severity: consider
        issue: >-
          Function or symbol names misrepresent behavior, hide side effects, or break written naming rules.
        results: []
      - id: readability.structure
        scope: file
        default_severity: consider
        issue: The changed control flow is hard to follow.
        results: []
  - title: Semantic Organization
    criteria:
      - id: organization.roles
        scope: file
        default_severity: consider
        issue: A module mixes responsibilities or its imports, exports, or public API obscure its role.
        results: []
      - id: organization.architecture
        scope: review
        default_severity: consider
        issue: Files or classes mix responsibilities, obscure ownership, or break written architecture rules.
        results: []
      - id: organization.api-ergonomics
        scope: applicable-file
        applies_when: Added or modified public APIs, exported types, methods, or classes.
        default_severity: consider
        issue: Public APIs expose types unrelated to the module role or remain hard to discover and use.
        results: []
      - id: organization.new-files
        scope: applicable-file
        applies_when: Added source files that introduce a module or submodule. A rename alone does not qualify.
        default_severity: consider
        issue: >-
          A new file lacks a clear module boundary or contains functions that belong in an existing module.
        results: []
      - id: organization.file-structure
        scope: file
        default_severity: consider
        issue: A file breaks the prescribed section order or declaration layout.
        results: []
  - title: Maintainability
    criteria:
      - id: maintainability.concepts
        scope: review
        default_severity: consider
        issue: >-
          New fields, types, wrappers, helpers, dependencies, or layers lack a clear caller need and add complexity.
        results: []
      - id: maintainability.complexity
        scope: applicable-file
        applies_when: >-
          Files with added or changed executable functions. For new functions, evaluate whether required behavior needs the introduced branches.
        default_severity: consider
        issue: Cyclomatic complexity grows beyond what the required behavior needs.
        results: []
      - id: maintainability.utilities
        scope: review
        default_severity: consider
        issue: Duplicated state, repeated logic, or inline work makes a function hard to read or maintain.
        results: []
      - id: maintainability.packages
        scope: review
        default_severity: consider
        issue: >-
          Custom code recreates functionality that an established package already provides.
        results: []
  - title: Reliability/Testing
    criteria:
      - id: testing.correctness
        scope: file
        default_severity: blocking
        issue: The changed code produces wrong behavior.
        results: []
      - id: testing.application
        scope: review
        default_severity: consider
        issue: >-
          Required behavior lacks outside-in test evidence (e2e over integration over unit), or tests lack human-verifiable outputs such as snapshots, logs, or JSON payloads.
        results: []
      - id: testing.relevance
        scope: applicable-file
        applies_when: Added or modified test files.
        default_severity: consider
        issue: >-
          Verbose unit tests pad coverage without proving real contracts or exercise only external dependencies. Tests inspect static asset or template structure, test the test apparatus, or add same-changeset or alpha regression tests.
        results: []
      - id: testing.names
        scope: applicable-file
        applies_when: Added or modified test files.
        default_severity: consider
        issue: >-
          A test name omits the tested functionality or its expected outcome.
        results: []
      - id: testing.arrange-act-assert
        scope: applicable-file
        applies_when: Added or modified test files.
        default_severity: consider
        issue: >-
          Test organization lacks clear BDD structure (given, when, then) or mixes setup, actions, and assertions.
        results: []
      - id: testing.fixtures
        scope: applicable-file
        applies_when: Added or modified tests, fixtures, test setup, or test utility files.
        default_severity: consider
        issue: >-
          Repeated setup, unsuitable fixtures, or duplicated helpers obscure tests.
        results: []
  - title: Documentation
    criteria:
      - id: documentation.conciseness
        scope: applicable-file
        applies_when: Added or modified documentation and documentation comments.
        default_severity: consider
        issue: Long, dense, or complex prose makes documentation hard to read.
        results: []
      - id: documentation.redundancy
        scope: applicable-file
        applies_when: Added or modified documentation and documentation comments.
        default_severity: consider
        issue: Documentation repeats code or existing prose without adding context.
        results: []
      - id: documentation.visuals
        scope: applicable-file
        applies_when: Added or modified documentation that explains structures, flows, or relationships.
        default_severity: consider
        issue: Long prose hides structure or flow that a diagram or tree shows clearly.
        results: []
      - id: documentation.requirements
        scope: applicable-file
        applies_when: >-
          Added or modified plans, architecture designs, PRDs, or planning intents with Requirement or Requirements sections.
        default_severity: consider
        issue: >-
          Requirement or Requirements sections use FR or NFR prefixes or state internal implementation specifications. Requirements omit observable behavior or performance, security, cost, isolation, and reliability characteristics from a client or end-user perspective.
        results: []
  - title: Performance
    criteria:
      - id: performance.regressions
        scope: review
        default_severity: consider
        issue: The change introduces a material performance regression.
        results: []
  - title: Security
    optional: true
    criteria:
      - id: security.defects
        scope: review
        default_severity: blocking
        issue: The change exposes secrets or breaks authorization or a trust boundary.
        results: []
