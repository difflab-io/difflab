version: 1
review:
  base_revision: null
  head_revision: null
  working_tree: null
  changed_files: []
  exclusions: []
  section_reviewers: []
sections:
  - title: Intent Delivery
    criteria:
      - id: intent.objective
        scope: review
        default_severity: blocking
        issue: The change contradicts its stated intent or omits required behavior.
        results: []
      - id: intent.scope
        scope: review
        default_severity: consider
        issue: The change includes work outside its stated scope.
        results: []
  - title: Readability
    criteria:
      - id: readability.function-names
        scope: file
        default_severity: consider
        issue: >-
          Function or other names misrepresent behavior, hide side effects, or break established naming conventions.
        results: []
      - id: readability.structure
        scope: file
        default_severity: consider
        issue: The changed flow is materially hard to follow.
        results: []
  - title: Semantic Organization
    criteria:
      - id: organization.roles
        scope: file
        default_severity: consider
        issue: A module mixes responsibilities or its imports, exports, or public API obscure its role.
        results: []
      - id: organization.architecture
        scope: review
        default_severity: consider
        issue: Files or classes break the established architecture or module patterns.
        results: []
      - id: organization.new-files
        scope: applicable-file
        applies_when: Added source files that introduce a module or submodule. A rename alone does not qualify.
        default_severity: consider
        issue: >-
          A new file lacks a justified module boundary or contains functions that belong in an existing module.
        results: []
      - id: organization.file-structure
        scope: file
        default_severity: consider
        issue: A file breaks the project-prescribed structure or declaration order.
        results: []
  - title: Maintainability
    criteria:
      - id: maintainability.concepts
        scope: review
        default_severity: consider
        issue: >-
          New fields, types, wrappers, helpers, dependencies, or layers lack a justified use and add needless complexity.
        results: []
      - id: maintainability.complexity
        scope: applicable-file
        applies_when: >-
          Files with added or changed executable functions. For new functions, assess whether the introduced decision paths are justified.
        default_severity: consider
        issue: Cyclomatic complexity grows without justification from the required behavior.
        results: []
      - id: maintainability.utilities
        scope: review
        default_severity: consider
        issue: Duplicated state or behavior, or inline work, makes a function harder to read or maintain.
        results: []
      - id: maintainability.packages
        scope: review
        default_severity: consider
        issue: >-
          Custom code recreates functionality that an established, widely used package suitably provides.
        results: []
  - title: Reliability/Testing
    criteria:
      - id: testing.correctness
        scope: file
        default_severity: blocking
        issue: The changed code produces incorrect behavior.
        results: []
      - id: testing.application
        scope: review
        default_severity: consider
        issue: Required behavior or a meaningful regression lacks test evidence.
        results: []
      - id: testing.arrange-act-assert
        scope: applicable-file
        applies_when: Added or modified test files.
        default_severity: consider
        issue: >-
          Test grouping, names, or interleaved setup, actions, and assertions hide the scenario or expected result.
        results: []
      - id: testing.fixtures
        scope: applicable-file
        applies_when: Added or modified tests, fixtures, test setup, or test utility files.
        default_severity: consider
        issue: >-
          Repeated setup, unsuitable fixtures, or recreated shared utilities obscure tests or duplicate existing helpers.
        results: []
  - title: Performance
    criteria:
      - id: performance.regressions
        scope: review
        default_severity: consider
        issue: The change causes a material performance regression.
        results: []
  - title: Security
    optional: true
    criteria:
      - id: security.defects
        scope: review
        default_severity: blocking
        issue: The change exposes secrets or breaks authorization or a trust boundary.
        results: []
