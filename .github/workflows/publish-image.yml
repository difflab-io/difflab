---
# TODO(CLO-237): Remove this standalone workflow once Premise supports matrixed multi-arch Docker/GHCR OCI image builds natively.
name: Publish OCI Image

'on':
  release:
    types:
      - published
  pull_request:
    branches:
      - main
    paths:
      - 'apps/difflab-web/**'
      - 'libs/ui/**'
      - 'libs/difflab-db/**'
      - 'libs/difflab-config/**'
      - 'docker-compose.yml'
      - '.github/workflows/publish-image.yml'

permissions:
  contents: read
  packages: write

jobs:
  image:
    name: Build and publish difflab-web OCI image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'release'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/difflab-web
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/difflab-web/Dockerfile
          platforms: ${{ github.event_name == 'release' && 'linux/amd64,linux/arm64' || 'linux/amd64' }}
          push: ${{ github.event_name == 'release' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
