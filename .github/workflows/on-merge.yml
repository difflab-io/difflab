---
name: On Merge

'on':
  push:
    branches:
      - main

permissions:
  contents: write
  id-token: write
  packages: write

concurrency:
  group: stable-release
  cancel-in-progress: false

jobs:
  release:
    name: Validate and publish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Run on-merge flow
        uses: cloudvoyant/premise@v0.4.2
        env:
          GITHUB_TOKEN: ${{ github.token }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          CRATES_TOKEN: ${{ secrets.CRATES_TOKEN }}
        with:
          flow: on-merge
          release: auto
          install-premise: build

  # TODO(CLO-237): Move OCI image release publishing into Premise's native on-merge flow once matrixed Docker builds ship.
  image:
    name: Build and publish difflab-web OCI image
    needs: release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Resolve release tags
        id: version
        run: |
          IMAGE="ghcr.io/${{ github.repository_owner }}/difflab-web"
          TAG="$(git describe --tags --exact-match HEAD 2>/dev/null || true)"
          {
            echo "tags<<EOF"
            if [ -n "$TAG" ]; then
              VER="${TAG#v}"
              MINOR="$(echo "$VER" | cut -d. -f1,2)"
              echo "${IMAGE}:${VER}"
              echo "${IMAGE}:${MINOR}"
              echo "${IMAGE}:latest"
            else
              SHORT="$(git rev-parse --short HEAD)"
              echo "${IMAGE}:sha-${SHORT}"
              echo "${IMAGE}:latest"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push multi-arch image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/difflab-web/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.version.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
