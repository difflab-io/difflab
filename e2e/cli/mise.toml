[tasks.test]
depends = ["//apps/difflab-cli:build"]
description = "Readable TypeScript difflab daemon and flows CLI E2E journeys"
dir = "{{config_root}}/../.."
run = "bun x vitest run --config e2e/cli/vitest.config.ts"

[tasks.smoke]
depends = ["//apps/difflab-cli:build"]
description = "Run representative difflab CLI smoke E2E journeys"
dir = "{{config_root}}/../.."
run = "bun x vitest run --config e2e/cli/vitest.config.ts --tags-filter=smoke --hideSkippedTests"

[tasks.list]
description = "List difflab CLI BDD journeys without running them"
dir = "{{config_root}}/../.."
run = "bun x vitest list --config e2e/cli/vitest.config.ts"

[tasks.lint]
dir = "{{config_root}}/../.."
run = "bun x eslint e2e/cli e2e/common"

[tasks.format]
dir = "{{config_root}}/../.."
run = "bun x prettier --write 'e2e/cli/**/*.ts' 'e2e/common/**/*.ts'"

[tasks."format:check"]
dir = "{{config_root}}/../.."
run = "bun x prettier --check 'e2e/cli/**/*.ts' 'e2e/common/**/*.ts'"
