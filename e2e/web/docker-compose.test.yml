services:
  dex:
    image: ghcr.io/dexidp/dex:v2.42.0
    command: ['dex', 'serve', '/etc/dex/config.yaml']
    ports:
      - '5556:5556'
    volumes:
      - ./e2e/web/dex-config.yaml:/etc/dex/config.yaml:ro

  web:
    depends_on:
      dex:
        condition: service_started
    environment:
      DIFFLAB_AUTH_PROVIDER: oidc
      OIDC_ISSUER_URL: http://dex:5556/dex
      OIDC_CLIENT_ID: difflab-web-e2e
      OIDC_CLIENT_SECRET: difflab-web-e2e-secret
      SESSION_SECRET: e2e-compose-session-secret-32-bytes!!
      ORIGIN: http://127.0.0.1:${DIFFLAB_WEB_PORT:-3000}
