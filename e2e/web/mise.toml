[tasks.install]
description = "Install Playwright Chromium browser for Flows UI E2E"
depends = ["//:install"]
dir = "{{config_root}}/../.."
run = '''
set -eu
if [ "$(uname -s)" = "Linux" ] && command -v apt-get >/dev/null 2>&1; then
  sudo -n bunx --no-install playwright install --with-deps chromium || bunx --no-install playwright install chromium
else
  bunx --no-install playwright install chromium
fi
'''

[tasks.test]
description = "Run SvelteKit Flows UI Playwright browser E2E journeys"
depends = ["install", "//apps/difflab-cli:build"]
dir = "{{config_root}}/../.."
run = "bunx --no-install playwright test --config e2e/web/playwright.config.ts"

[tasks.smoke]
description = "Run smoke SvelteKit Flows UI Playwright browser E2E journeys"
depends = ["install", "//apps/difflab-cli:build"]
dir = "{{config_root}}/../.."
run = "bunx --no-install playwright test --config e2e/web/playwright.config.ts --grep @smoke"

[tasks.list]
description = "List SvelteKit Flows UI browser journeys without running them"
depends = ["//:install"]
dir = "{{config_root}}/../.."
run = "bunx --no-install playwright test --config e2e/web/playwright.config.ts --list"

[tasks.lint]
dir = "{{config_root}}/../.."
run = "bunx --no-install eslint e2e/web e2e/common"

[tasks.format]
dir = "{{config_root}}/../.."
run = "bunx --no-install prettier --write 'e2e/web/**/*.ts'"

[tasks."format:check"]
dir = "{{config_root}}/../.."
run = "bunx --no-install prettier --check 'e2e/web/**/*.ts'"
