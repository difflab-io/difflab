# Workspace-level mise configuration generated by premise.
# Project lifecycle tasks are addressed with `mise run '//...:<task>'`.

monorepo_root = true

[env]
_.path = ["{{config_root}}/bin"]
DIFFLAB_HOME = "{{config_root}}/.tmp/difflab-home"

[tools]
bun = "1.4.2"
buf = "1.75.0"

[monorepo]
config_roots = ["apps/*", "libs/*", "e2e/api", "e2e/cli"]

[tasks.install]
description = "Install workspace Bun dependencies"
run = "bun install"

[tasks.e2e]
description = "Run all API and CLI end-to-end test suites"
depends = ["//e2e/api:test", "//e2e/cli:test"]
run = 'echo "Completed all E2E suites. Inspect retained artifacts under e2e/outputs/."'

[tasks."e2e:api"]
description = "Run difflab-api end-to-end specs"
depends = ["//e2e/api:test"]
run = 'echo "Completed e2e/api suite."'

[tasks."e2e:cli"]
description = "Run difflab-cli and MCP end-to-end specs"
depends = ["//e2e/cli:test"]
run = 'echo "Completed e2e/cli suite."'

[tasks."e2e:smoke"]
description = "Run fast API and CLI smoke specs"
depends = ["install"]
run = "bun test --timeout 30000 e2e/api/project-service.spec.ts e2e/cli/help.spec.ts e2e/cli/projects.spec.ts"

[tasks."e2e:list"]
description = "List all end-to-end spec files"
run = "find e2e/api e2e/cli -name '*.spec.ts' | sort"
