# Workspace-level mise configuration generated by premise.
# Project lifecycle tasks are addressed with `mise run '//...:<task>'`.

monorepo_root = true

[env]
_.path = ["{{config_root}}/bin"]

[tools]
bun = "1.4.2"

[monorepo]
config_roots = ["apps/*", "libs/*", "e2e/cli"]

[tasks.install]
description = "Install workspace Bun dependencies"
run = "bun install"

[tasks.e2e]
description = "Run CLI end-to-end test suite"
depends = ["//e2e/cli:test"]
run = 'echo "Completed E2E suite. Inspect retained artifacts under e2e/outputs/."'
