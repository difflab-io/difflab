# Workspace-level mise configuration generated by premise.
# Project lifecycle tasks are addressed with `mise run '//...:<task>'`.

monorepo_root = true

[env]
_.path = ["{{config_root}}/bin"]

[tools]
bun = "1.4.2"

[monorepo]
config_roots = ["apps/*", "libs/*"]

[tasks.install]
description = "Install workspace Bun dependencies"
run = "bun install"
