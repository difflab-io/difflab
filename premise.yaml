workspace:
  name: difflab
  kind: monorepo
  schema-version: '0.2'
  package_managers:
    - bun
  providers:
    ci: github
    tools: mise
    tasks: mise
    infra: pulumi
    versioning: svu
  projects:
    - name: difflab-cli
      template: cloudvoyant/premise-bun:premise-commander-cli
      path: apps/difflab-cli
      answers:
        name: difflab-cli
