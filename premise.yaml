workspace:
  name: difflab
  kind: monorepo
  schema-version: '0.2'
  package_managers:
    - bun
  providers:
    ci: github
    tools: mise
    tasks: mise
    infra: pulumi
    versioning: svu
  projects:
    - name: difflab-api
      template: cloudvoyant/premise-bun:premise-hono-api
      path: apps/difflab-api
      answers:
        name: difflab-api
    - name: difflab-cli
      template: cloudvoyant/premise-bun:premise-commander-cli
      path: apps/difflab-cli
      answers:
        name: difflab-cli
    - name: difflab-web
      template: cloudvoyant/premise-bun:premise-sveltekit-app
      path: apps/difflab-web
      answers:
        name: difflab-web
    - name: difflab-client-ts
      template: cloudvoyant/premise-bun:premise-ts-lib
      path: libs/difflab-client-ts
      answers:
        name: difflab-client-ts
    - name: difflab-config
      template: cloudvoyant/premise-bun:premise-ts-lib
      path: libs/difflab-config
      answers:
        name: difflab-config
    - name: difflab-db
      template: cloudvoyant/premise-bun:premise-ts-lib
      path: libs/difflab-db
      answers:
        name: difflab-db
    - name: difflab-db-legacy
      template: cloudvoyant/premise-bun:premise-ts-lib
      path: libs/difflab-db-legacy
      answers:
        name: difflab-db-legacy
    - name: ui
      template: cloudvoyant/premise-bun:premise-ts-lib
      path: libs/ui
      answers:
        name: ui
